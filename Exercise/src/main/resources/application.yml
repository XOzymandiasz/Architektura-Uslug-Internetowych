server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: exercise

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://exercise-db:5432/exercise_db}
    username: ${SPRING_DATASOURCE_USERNAME:exercise}
    password: ${SPRING_DATASOURCE_PASSWORD:exercise}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  exercise-result:
    base-url: ${EXERCISE_RESULT_BASE_URL:http://exercise-result:5000}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://eureka:5678/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:exercise}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    # Te 2 opcje przyspieszają reakcję w dev (szybciej widać UP/DOWN)
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEW:10}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRE:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_DETAILS:always}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_BINDER_LOG_LEVEL:TRACE}
    com.netflix.discovery: ${EUREKA_LOG_LEVEL:INFO}
    org.springframework.cloud.netflix.eureka: ${EUREKA_LOG_LEVEL:INFO}