server:
  port: 5000

spring:
  application:
    name: Exercise

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exercise_db}
    username: ${SPRING_DATASOURCE_USERNAME:exercise}
    password: ${SPRING_DATASOURCE_PASSWORD:exercise}
    driver-class-name: org.postgresql.Driver

  exercise-result:
    base-url: ${EXERCISE_RESULT_BASE_URL:https://exercise-result:5000}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka:5678/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
