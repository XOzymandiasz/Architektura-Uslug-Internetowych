<h2>Exercise results</h2>
  <a [routerLink]="['/exercise', exerciseId, 'result', 'new']"
     target="_blank"
     class="btn create">
    Add Result
  </a>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Set</th>
      <th>Reps</th>
      <th>Weight</th>
      <th>Personal Best</th>
      <th>View</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>
      @for (result of results; track result.id) {
        <tr>
          <td>{{ result.id }}</td>
          <td>{{ result.set }}</td>
          <td>{{ result.reps }}</td>
          <td>{{ result.weight }}</td>
          <td>{{ result.personalBest ? 'Yes' : 'No' }}</td>
          <td>
            <a [routerLink]="['/exercise', exerciseId, 'result', result.id]"
               target="_blank"
               class="btn info">
              View
            </a>
          </td>
          <td>
            <a [routerLink]="['/exercise', exerciseId, 'result', 'new']"
               target="_blank"
               class="btn update">
              Update
            </a>
          </td>

          <td>
            <button class="btn delete" (click)="onDelete(result.id)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
<ng-template #empty>
  <p>No results yet.</p>
</ng-template>
