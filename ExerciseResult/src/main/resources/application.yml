server:
  port: 5000

spring:
  application:
    name: ExerciseResult

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exercise_result_db}
    username: ${SPRING_DATASOURCE_USERNAME:exercise_result}
    password: ${SPRING_DATASOURCE_PASSWORD:exercise_result}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
